name: todo_crud_app_sqlite
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # for local storage
  sqflite: ^2.4.1
  json_annotation: ^4.12.0
  path: ^1.9.1

  # for theme mangement
  shared_preferences: ^2.5.5

  # state management
  bloc: ^9.2.1
