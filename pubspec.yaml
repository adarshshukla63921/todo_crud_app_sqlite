  freezed_annotation: ^3.1.0

  # navigation
  go_router: ^17.2.3

  # formatted strings for dates etc
  intl: ^0.20.2

  # dependency injection
  get_it: ^9.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^3.2.5
  build_runner: ^2.15.0
  json_serializable: ^6.14.0
flutter:
  uses-material-design: true

